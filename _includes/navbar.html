<nav class="navbar navbar-expand-sm navbar-dark football-navbar fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="navbar-identity">
            <button class="united-crest-button" type="button" data-united-crest aria-label="Spin the Manchester United crest" title="Click to spin the Manchester United crest">
                <img class="united-crest-image" src="{{ '/assets/images/etc/manchester-united-crest.png' | relative_url }}" width="32" height="32" alt="" draggable="false">
            </button>
            <span class="sr-only united-status" aria-live="polite"></span>
            <a class="navbar-brand" href="{{ '/' | relative_url }}">{{site.data.profile.navbar_name}}</a>
            <button class="siu-celebration" type="button" data-siu-celebration aria-label="Play Cristiano Ronaldo's Siu celebration" title="Click for a Siu!">
                <img class="siu-player" src="{{ '/assets/images/etc/ronaldo-siu.png' | relative_url }}" width="40" height="40" alt="" draggable="false">
                <span class="siu-impact" aria-hidden="true"></span>
                <span class="siu-word" aria-hidden="true">SIUU!</span>
            </button>
            <span class="sr-only siu-status" aria-live="polite"></span>
        </div>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> Menu
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}>{% if item.icon == "cat" %}{% include icons/cat.html %} {% endif %}{{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
