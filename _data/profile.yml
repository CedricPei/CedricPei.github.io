short_bio: >-
  <p>
    I am an MPhil (master by research) student at The University of Hong Kong, supervised by <a href="https://hongyangdu.github.io/" target="_blank">Prof. Hongyang Du</a> at NICE Lab. Prior to this, I earned my Bachelor's degree at the National University of Singapore, where I completed my capstone under the supervision of <a href="https://www.comp.nus.edu.sg/~hebs/" target="_blank">Prof. Bingsheng He</a>. My research interests include <span class="research-interest publication-tag--data-agent">Data Agents</span>, <span class="research-interest publication-tag--evaluation">LLM Evaluation</span>, <span class="research-interest publication-tag--multimodal">Multimodal Models</span>, and <span class="research-interest publication-tag--efficient">Efficient AI</span>. I am open to collaborating with people who share similar research interests.
  </p>
  <p>
    <strong>I am currently seeking PhD opportunities for Fall 2027.</strong> Please feel free to reach out if you see a potential research fit.
  </p>

